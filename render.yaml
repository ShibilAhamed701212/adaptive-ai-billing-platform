services:
  - type: web
    name: adaptive-billing-web
    runtime: static
    buildCommand: npm run build --workspace=shared && npm run build --workspace=frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://adaptive-billing-api.onrender.com

  - type: web
    name: adaptive-billing-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://adaptive-billing-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      # Required: the API refuses to start in production without these two.
      - key: MONGODB_URI
        sync: false
      # Needed for password reset emails
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
