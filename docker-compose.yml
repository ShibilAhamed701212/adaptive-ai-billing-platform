services:
  mongodb:
    image: mongo:7.0
    container_name: billing_mongodb
    restart: unless-stopped
    # Sales, payments, returns and restores use multi-document transactions, which MongoDB only
    # supports on a replica set. Run a single-node replica set and initiate it on first start.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=adaptive_billing
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Production image (API + built SPA). Opt-in: docker compose --profile app up -d --build
  api:
    profiles: ['app']
    build: .
    image: adaptive-billing
    container_name: billing_api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - '10000:10000'
    environment:
      - NODE_ENV=production
      - PORT=10000
      # The replica-set member advertises localhost:27017, which only resolves on the host;
      # directConnection makes the driver use the compose service name instead.
      - MONGODB_URI=mongodb://mongodb:27017/adaptive_billing?directConnection=true
      - CLIENT_URL=${CLIENT_URL:-http://localhost:10000}
      # Required; the server refuses to start in production without a strong secret.
      - JWT_SECRET=${JWT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

volumes:
  mongo_data:
