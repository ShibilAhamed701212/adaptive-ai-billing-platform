services:
  mongodb:
    image: mongo:7.0
    container_name: billing_mongodb
    restart: unless-stopped
    # Sales, payments, returns and restores use multi-document transactions, which MongoDB only
    # supports on a replica set. Run a single-node replica set and initiate it on first start.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=adaptive_billing
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo_data:
