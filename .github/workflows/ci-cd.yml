name: CI/CD Pipeline - Adaptive Billing Platform

on:
  push:
    branches:
      - main
      - shibilahamed701212-billing-platform-fix
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build All Workspaces (Shared, Backend, Frontend)
        run: npm run build
        env:
          VITE_API_URL: https://adaptive-billing-api.onrender.com

      - name: Run Backend Unit Tests
        run: npm test --workspace=backend
